name: Release Windows EXE

# Builds the packaged Windows desktop app (API + static dashboard in one
# folder) and attaches it to a GitHub Release. Run manually from the
# Actions tab, or push a tag like v0.1.0 to release automatically.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build static dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build:static

      - name: Build EXE
        run: pyinstaller packaging/ShahidWorkforce.spec --distpath dist --workpath build --noconfirm

      - name: Smoke test (boot, health, static dashboard)
        run: |
          $proc = Start-Process -FilePath "dist\ShahidWorkforce\ShahidWorkforce.exe" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:8756/health" -TimeoutSec 3
              if ($health.status -eq "ok") { $ok = $true; break }
            } catch { }
            if ($proc.HasExited) { Write-Output "exe exited early with code $($proc.ExitCode)"; break }
          }
          if (-not $ok) { Write-Output "health check never succeeded"; Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; exit 1 }
          $root = Invoke-WebRequest "http://127.0.0.1:8756/" -UseBasicParsing -TimeoutSec 10
          $body = "" + $root.Content
          if ($root.StatusCode -ne 200 -or $body -notmatch "__WF_KEY") { Write-Output "static dashboard not served with key injection"; Stop-Process -Id $proc.Id -Force; exit 1 }
          Write-Output "SMOKE OK: health + injected dashboard on 8756"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ShahidWorkforce" -DestinationPath "ShahidWorkforce-win64.zip" -Force
          Get-Item "ShahidWorkforce-win64.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShahidWorkforce-win64
          path: ShahidWorkforce-win64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ShahidWorkforce-win64.zip
          generate_release_notes: true
