[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shahid-assistant-ai"
version = "0.1.0"
description = "Shahid Assistant AI - multi-agent AI workforce"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "redis>=5.0",
    "rq>=2.0",
    "litellm>=1.60",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.setuptools]
# Monorepo layout: services/, agents/, tools/ etc. are not one installable
# package. Install dependencies only; switch to explicit package discovery
# when a real package structure exists.
packages = []

[tool.ruff.lint]
# Deterministic rule set (independent of ruff's changing defaults).
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "B"]
# B008: FastAPI's Depends() in argument defaults is the documented idiom.
ignore = ["B008"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
