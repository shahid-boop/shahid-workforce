# Local development stack: API, worker, Redis, PostgreSQL.
# The code sandbox runs as a separate restricted container (see sandbox/).
services:
  api:
    build: .
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    environment:
      WORKFORCE_DATABASE_URL: postgresql+psycopg://shahid:shahid@db:5432/shahid_workforce
      REDIS_URL: redis://redis:6379/0
      WORKFORCE_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: rq worker -u redis://redis:6379/0 shahid-workforce
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shahid
      POSTGRES_PASSWORD: shahid
      POSTGRES_DB: shahid_workforce
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
