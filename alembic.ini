# Alembic configuration for the workforce database.
#
# URL resolution: database/migrations/env.py prefers the ALEMBIC_DATABASE_URL
# environment variable, then WORKFORCE_DATABASE_URL, then this file's
# sqlalchemy.url (sqlite by default).

[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url = sqlite:///./workforce.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
