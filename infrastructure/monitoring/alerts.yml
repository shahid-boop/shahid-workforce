# Alert rules for the workforce stack.

groups:
  - name: workforce
    rules:
      - alert: ApiDown
        expr: up{job="workforce-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Workforce API is down"
          description: "The API target has been unreachable for 2 minutes."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="workforce-api",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="workforce-api"}[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API 5xx rate above 5%"
          description: "More than 5% of requests are failing for 10 minutes."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis (job queue) is down"
          description: "Task workers cannot enqueue while Redis is unreachable."
